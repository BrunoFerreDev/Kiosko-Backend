<!doctype html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalles del Cliente | Mi Kiosko</title>
    <link rel="shortcut icon" href="../css/iconWeb.webp" type="image/x-icon" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Shared Config & Custom CSS -->
    <script src="../js/config/tailwind.config.js"></script>
    <link rel="stylesheet" href="../css/styles.css" />

    <!-- Web Components & Application Scripts (ES Modules) -->
    <script type="module" src="../js/services/api.js"></script>
    <script type="module" src="../js/components/loader.js"></script>
    <script type="module" src="../js/components/pagination.js"></script>
    <script type="module" src="../js/components/sidebar.js"></script>
    <script type="module" src="../js/components/topbar.js"></script>
    <script type="module" src="../js/components/kpi-card.js"></script>
    <script type="module" src="../js/components/table-history.js"></script>
    <script type="module" src="../js/components/modal-client.js"></script>
    <script type="module" src="../js/components/modal-annotation.js"></script>
    <script type="module" src="../js/components/modal-payment.js"></script>
    <script type="module" src="../js/app.js"></script>
  </head>
  <body
    class="bg-background text-on-background font-body-md text-body-md antialiased flex flex-col md:flex-row min-h-screen"
  >
    <!-- Sidebar Web Component -->
    <app-sidebar active="clients"></app-sidebar>

    <!-- Main Content Area -->
    <main class="ml-0 md:ml-64 flex-1 flex flex-col min-h-screen w-full">
      <!-- Topbar Web Component -->
      <!-- <app-topbar placeholder="Buscar movimiento..."></app-topbar> -->

      <!-- Content Canvas -->
      <div class="flex-1 p-4 sm:p-6 lg:p-container-padding overflow-y-auto">
        <!-- Back link to Clients List -->
        <div
          class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6"
        >
          <a
            class="flex items-center gap-2 text-primary hover:text-primary-fixed-variant transition-colors font-body-md text-body-md font-semibold"
            href="clientes.html"
          >
            <span class="material-symbols-outlined" style="font-size: 20px"
              >arrow_back</span
            >
            <span>Volver a Lista de Clientes</span>
          </a>

          <div class="flex items-center gap-3">
            <button
              onclick="openClientModal()"
              class="admin-only w-full sm:w-auto h-10 px-4 bg-surface-container-highest text-primary rounded-xl hover:bg-surface-container-high transition-colors font-data-table text-data-table font-semibold cursor-pointer border border-outline-variant/30 flex items-center justify-center gap-2"
            >
              <span class="material-symbols-outlined text-sm">person_add</span>
              <span>Nuevo Cliente</span>
            </button>
          </div>
        </div>

        <!-- Client Profile & Actions Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
          <!-- Client Profile Card (Text Only) -->
          <div
            class="lg:col-span-2 bg-surface-container-lowest rounded-xl p-6 shadow-sm border border-outline-variant/30 flex flex-col justify-center relative overflow-hidden"
          >
            <div
              class="absolute -right-16 -top-16 w-48 h-48 bg-primary-fixed-dim/20 rounded-full blur-3xl pointer-events-none"
            ></div>

            <div class="flex-1">
              <h2
                id="client-card-name"
                class="font-display-lg text-2xl sm:text-3xl lg:text-display-lg text-on-background font-bold mb-1"
              >
                Cargando cliente...
              </h2>
              <div class="flex flex-col sm:flex-row gap-2 sm:gap-6 mt-3">
                <div
                  class="flex items-center gap-2 text-on-surface-variant font-body-md text-body-md"
                >
                  <span
                    class="material-symbols-outlined"
                    style="font-size: 18px"
                    >call</span
                  >
                  <span id="client-card-phone">--</span>
                </div>
                <div
                  class="flex items-center gap-2 text-on-surface-variant font-body-md text-body-md"
                >
                  <span
                    class="material-symbols-outlined"
                    style="font-size: 18px"
                    >verified_user</span
                  >
                  <span>Estado: Activo</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Balance & Quick Actions Card -->
          <div
            class="bg-surface-container-lowest rounded-xl p-6 shadow-sm border border-outline-variant/30 flex flex-col justify-between"
          >
            <div>
              <p
                class="font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase tracking-wider font-semibold"
              >
                Deuda Total Pendiente
              </p>
              <div
                class="bg-error-container/30 px-4 py-3 rounded-xl border border-error-container"
              >
                <span
                  id="client-card-debt"
                  class="font-display-lg text-2xl sm:text-3xl lg:text-display-lg text-on-error-container font-bold"
                  >$ 0.00</span
                >
              </div>
            </div>
            <div class="flex gap-3 mt-6">
              <button
                onclick="openPaymentModal()"
                class="admin-only flex-1 bg-primary text-on-primary rounded-xl h-touch-target-min font-body-md text-body-md font-bold shadow-sm hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer"
              >
                <span class="material-symbols-outlined" style="font-size: 20px"
                  >payments</span
                >
                <span>Cobrar</span>
              </button>
              <button
                onclick="openAnnotationModal()"
                class="admin-only flex-1 bg-tertiary-container text-on-tertiary-container rounded-xl h-touch-target-min font-body-md text-body-md font-bold shadow-sm hover:bg-tertiary-container/90 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer"
              >
                <span class="material-symbols-outlined" style="font-size: 20px"
                  >add_shopping_cart</span
                >
                <span>Fiar</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Transaction History Table Component -->
        <app-table-history></app-table-history>
      </div>
    </main>

    <!-- Global Modals -->
    <app-modal-payment></app-modal-payment>
    <app-modal-client></app-modal-client>
    <app-modal-annotation></app-modal-annotation>
  </body>
</html>
