<!doctype html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Productos - Mi Kiosko</title>
    <link rel="shortcut icon" href="../css/iconWeb.webp" type="image/x-icon" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Shared Config & Custom CSS -->
    <script src="../js/config/tailwind.config.js"></script>
    <link rel="stylesheet" href="../css/styles.css" />

    <!-- Web Components & Application Scripts (ES Modules) -->
    <script type="module" src="../js/services/api.js"></script>
    <script type="module" src="../js/components/loader.js"></script>
    <script type="module" src="../js/components/pagination.js"></script>
    <script type="module" src="../js/components/sidebar.js"></script>
    <script type="module" src="../js/components/topbar.js"></script>
    <script type="module" src="../js/components/kpi-card.js"></script>
    <script type="module" src="../js/components/table-products.js"></script>
    <script type="module" src="../js/components/modal-client.js"></script>
    <script type="module" src="../js/components/modal-annotation.js"></script>
    <script type="module" src="../js/components/modal-product.js"></script>
    <script type="module" src="../js/components/modal-brand.js"></script>
    <script type="module" src="../js/components/modal-category.js"></script>
    <script type="module" src="../js/components/modal-upload.js"></script>
    <script type="module" src="../js/app.js"></script>
  </head>
  <body
    class="bg-background text-on-background font-body-md text-body-md antialiased flex flex-col md:flex-row min-h-screen"
  >
    <!-- Sidebar Web Component -->
    <app-sidebar active="products"></app-sidebar>

    <!-- Main Content Area -->
    <main class="ml-0 md:ml-64 flex-1 flex flex-col min-h-screen w-full">
      <app-topbar></app-topbar>

      <!-- Main Content Canvas -->
      <div class="flex-1 p-4 sm:p-6 lg:p-container-padding overflow-y-auto">
        <!-- Page Header -->
        <div
          class="flex flex-col sm:flex-row justify-between sm:items-end gap-3 mb-6"
        >
          <div>
            <p
              class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1"
            >
              Catálogo de Inventario
            </p>
            <h1
              class="font-display-lg text-2xl sm:text-3xl lg:text-display-lg text-on-surface font-bold"
            >
              Gestión de Productos
            </h1>
          </div>
          <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <button
              onclick="openBrandModal()"
              class="admin-only w-full sm:w-auto h-11 sm:h-12 px-4 flex items-center justify-center gap-2 bg-surface-container-highest text-primary border border-outline-variant/30 rounded-xl hover:bg-surface-container-high transition-colors font-data-table text-data-table font-semibold cursor-pointer"
            >
              <span class="material-symbols-outlined text-sm">add</span>
              <span>Nueva Marca</span>
            </button>
            <button
              onclick="openCategoryModal()"
              class="admin-only w-full sm:w-auto h-11 sm:h-12 px-4 flex items-center justify-center gap-2 bg-surface-container-highest text-primary border border-outline-variant/30 rounded-xl hover:bg-surface-container-high transition-colors font-data-table text-data-table font-semibold cursor-pointer"
            >
              <span class="material-symbols-outlined text-sm">add_circle</span>
              <span>Nueva Categoría</span>
            </button>
            <button
              onclick="openUploadModal()"
              class="admin-only w-full sm:w-auto h-11 sm:h-12 px-4 flex items-center justify-center gap-2 bg-surface-container-highest text-primary border border-outline-variant/30 rounded-xl hover:bg-surface-container-high transition-colors font-data-table text-data-table font-semibold cursor-pointer"
            >
              <span class="material-symbols-outlined text-sm">upload_file</span>
              <span>Importar Excel</span>
            </button>
            <button
              onclick="exportProducts(this)"
              class="admin-only w-full sm:w-auto h-11 sm:h-12 px-4 flex items-center justify-center gap-2 bg-surface-container-highest text-primary border border-outline-variant/30 rounded-xl hover:bg-surface-container-high transition-colors font-data-table text-data-table font-semibold cursor-pointer"
            >
              <span class="material-symbols-outlined text-sm">download</span>
              <span>Exportar Excel</span>
            </button>
            <button
              onclick="openProductModal()"
              class="admin-only w-full sm:w-auto h-11 sm:h-12 px-6 flex items-center justify-center gap-2 bg-primary text-on-primary rounded-xl hover:bg-primary-fixed-variant transition-colors shadow-sm font-data-table text-data-table font-semibold cursor-pointer"
            >
              <span class="material-symbols-outlined">add_box</span>
              <span>Nuevo Producto</span>
            </button>
          </div>
        </div>

        <!-- KPI Summary Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-card-gap mb-6">
          <app-kpi-card
            id="kpi-total-products"
            title="Total Productos Registrados"
            value="0"
            tag="Catálogo"
            icon="inventory_2"
          >
          </app-kpi-card>

          <app-kpi-card
            id="kpi-total-value"
            title="Valor Total del Inventario"
            value="0"
            prefix="$"
            tag="Estimado"
            icon="payments"
          >
          </app-kpi-card>
        </div>

        <!-- Products Table Component -->
        <app-table-products></app-table-products>
      </div>
    </main>

    <!-- Global Modals -->
    <app-modal-product></app-modal-product>
    <app-modal-client></app-modal-client>
    <app-modal-annotation></app-modal-annotation>
    <app-modal-brand></app-modal-brand>
    <app-modal-category></app-modal-category>
    <app-modal-upload></app-modal-upload>
  </body>
</html>
