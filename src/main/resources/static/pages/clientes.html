<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Mi Kiosko</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Shared Config & Custom CSS -->
  <script src="../js/config/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/styles.css">

  <!-- Web Components & Application Scripts (ES Modules) -->
  <script type="module" src="../js/services/api.js"></script>
  <script type="module" src="../js/components/loader.js"></script>
  <script type="module" src="../js/components/pagination.js"></script>
  <script type="module" src="../js/components/sidebar.js"></script>
  <script type="module" src="../js/components/topbar.js"></script>
  <script type="module" src="../js/components/kpi-card.js"></script>
  <script type="module" src="../js/components/table-clients.js"></script>
  <script type="module" src="../js/components/modal-client.js"></script>
  <script type="module" src="../js/components/modal-annotation.js"></script>
  <script type="module" src="../js/app.js"></script>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased flex flex-col md:flex-row min-h-screen">

  <!-- Sidebar Web Component -->
  <app-sidebar active="clients"></app-sidebar>

  <!-- Main Content Area -->
  <main class="ml-0 md:ml-64 flex-1 flex flex-col min-h-screen w-full">
    
    <!-- Topbar Web Component -->
    <app-topbar placeholder="Buscar cliente..."></app-topbar>

    <!-- Main Content Canvas -->
    <div class="flex-1 p-4 sm:p-6 lg:p-container-padding overflow-y-auto">
      
      <!-- Page Header -->
      <div class="flex flex-col sm:flex-row justify-between sm:items-end gap-3 mb-6">
        <div>
          <p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Cuentas Corrientes y Fiado</p>
          <h1 class="font-display-lg text-2xl sm:text-3xl lg:text-display-lg text-on-surface font-bold">Gestión de Clientes</h1>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="openClientModal()" class="admin-only w-full sm:w-auto h-11 sm:h-12 px-6 flex items-center justify-center gap-2 bg-primary text-on-primary rounded-xl hover:bg-primary-fixed-variant transition-colors shadow-sm font-data-table text-data-table font-semibold cursor-pointer">
            <span class="material-symbols-outlined">person_add</span>
            <span>Nuevo Cliente</span>
          </button>
        </div>
      </div>

      <!-- Dynamic KPI Summary Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-card-gap mb-6">
        <app-kpi-card 
          id="kpi-total-clients"
          title="Total Clientes Registrados" 
          value="0" 
          tag="Directorio" 
          icon="groups">
        </app-kpi-card>

        <app-kpi-card 
          id="kpi-debtors-count"
          title="Clientes con Deuda Activa" 
          value="0" 
          tag="Atención" 
          icon="group_off" 
          trend-type="error">
        </app-kpi-card>

        <app-kpi-card 
          id="kpi-total-debt"
          title="Deuda Total por Cobrar" 
          value="0" 
          prefix="$" 
          tag="Saldo Total" 
          icon="account_balance_wallet">
        </app-kpi-card>
      </div>

      <!-- Clients List Table Component -->
      <app-table-clients></app-table-clients>

    </div>
  </main>

  <!-- Global Modals -->
  <app-modal-client></app-modal-client>
  <app-modal-annotation></app-modal-annotation>

</body>
</html>
