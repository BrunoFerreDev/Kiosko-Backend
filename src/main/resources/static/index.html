<!doctype html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Kiosko - Dashboard</title>
    <link rel="shortcut icon" href="./css/iconWeb.webp" type="image/x-icon" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Shared Tailwind Config & Custom Styles -->
    <script src="js/config/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Web Components & Application Scripts (ES Modules) -->
    <script type="module" src="js/services/api.js"></script>
    <script type="module" src="js/components/loader.js"></script>
    <script type="module" src="js/components/pagination.js"></script>
    <script type="module" src="js/components/sidebar.js"></script>
    <script type="module" src="js/components/topbar.js"></script>
    <script type="module" src="js/components/kpi-card.js"></script>
    <script type="module" src="js/components/table-activity.js"></script>
    <script type="module" src="js/components/modal-client.js"></script>
    <script type="module" src="js/components/modal-annotation.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body
    class="bg-background text-on-background font-body-md text-body-md antialiased flex flex-col md:flex-row min-h-screen"
  >
    <!-- App Sidebar Component -->
    <app-sidebar active="dashboard"></app-sidebar>

    <!-- Main Content Wrapper (Mobile First) -->
    <div class="ml-0 md:ml-64 flex-1 flex flex-col min-h-screen w-full">
      <!-- App Topbar Component -->
      <!-- <app-topbar placeholder="Buscar cliente o producto..."></app-topbar> -->

      <!-- Main Dashboard Content -->
      <main
        class="p-4 sm:p-6 lg:p-container-padding flex-1 flex flex-col gap-card-gap"
      >
        <!-- Page Header -->
        <div
          class="flex flex-col sm:flex-row justify-between sm:items-end gap-3 mb-2"
        >
          <div>
            <p
              class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1"
              id="date"
            ></p>
            <h1
              class="font-display-lg text-2xl sm:text-3xl lg:text-display-lg text-on-surface font-bold"
            >
              Resumen General
            </h1>
          </div>
          <div class="flex items-center gap-2 sm:gap-3">
            <button
              onclick="openClientModal()"
              class="admin-only flex-1 sm:flex-initial h-11 sm:h-12 px-3 sm:px-5 flex items-center justify-center gap-1.5 sm:gap-2 bg-surface-container-highest text-primary rounded-xl hover:bg-surface-container-high transition-colors font-data-table text-xs sm:text-data-table font-semibold cursor-pointer border border-outline-variant/30"
            >
              <span class="material-symbols-outlined text-sm sm:text-base"
                >person_add</span
              >
              <span>Nuevo Cliente</span>
            </button>
            <button
              onclick="openAnnotationModal()"
              class="admin-only flex-1 sm:flex-initial h-11 sm:h-12 px-4 sm:px-6 flex items-center justify-center gap-1.5 sm:gap-2 bg-tertiary-container text-on-tertiary-container rounded-xl hover:bg-tertiary transition-colors shadow-sm font-data-table text-xs sm:text-data-table font-semibold cursor-pointer"
            >
              <span class="material-symbols-outlined text-sm sm:text-base"
                >note_add</span
              >
              <span>Nueva Anotación</span>
            </button>
          </div>
        </div>

        <!-- Dynamic KPI Grid -->
        <div
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-card-gap"
        >
          <app-kpi-card
            id="dash-kpi-total-debt"
            title="Total a Cobrar"
            value="0"
            prefix="$"
            tag="General"
            icon="account_balance_wallet"
          >
          </app-kpi-card>

          <app-kpi-card
            id="dash-kpi-debtors-count"
            title="Clientes con Deuda"
            value="0"
            tag="Atención"
            icon="group_off"
            trend-type="error"
          >
          </app-kpi-card>

          <app-kpi-card
            id="dash-kpi-today-count"
            title="Anotaciones de Hoy"
            value="0"
            tag="Hoy"
            icon="edit_document"
            trend-type="warning"
          >
          </app-kpi-card>
        </div>

        <!-- Lower Section (Activity Table Full Width) -->
        <div class="mt-2 sm:mt-4 w-full">
          <app-table-activity class="w-full"></app-table-activity>
        </div>
      </main>
    </div>

    <!-- Global Modals -->
    <app-modal-client></app-modal-client>
    <app-modal-annotation></app-modal-annotation>
  </body>
</html>
