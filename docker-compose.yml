services:
  kiosco-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiosco-backend
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    volumes:
      - kiosco-db-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kiosco-db-data:

